name: android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          # Node 24 mirrors the dev environment; npm 12 (needed for
          # patchedDependencies) itself requires Node >= 22.
          node-version: 24

      # npm patchedDependencies (our gradle-plugin patch) needs npm >= 12;
      # Node 20 bundles npm 10 which silently ignores the patch config.
      - name: Upgrade npm
        run: npm install -g npm@12

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install dependencies (workspaces + npm patches)
        run: npm install

      - name: Verify npm patches applied
        run: |
          if grep -q "foojay-resolver-convention" node_modules/@react-native/gradle-plugin/settings.gradle.kts; then
            echo "::error::gradle-plugin patch did not apply — build would fail on Gradle 9"
            exit 1
          fi
          if ! grep -q "isKShellConsoleOrigin" node_modules/react-native-webview/android/src/main/java/com/reactnativecommunity/webview/RNCWebView.java; then
            echo "::error::react-native-webview patch did not apply"
            exit 1
          fi
          if grep -qE "barcode-scanning|play-services-mlkit" node_modules/react-native-camera-kit/android/build.gradle || ! grep -q "com.google.zxing:core" node_modules/react-native-camera-kit/android/build.gradle; then
            echo "::error::react-native-camera-kit ZXing patch did not apply cleanly"
            exit 1
          fi

      - name: Run core-shell tests
        run: npx vitest run

      - name: Typecheck mobile app
        working-directory: apps/mobile
        run: npm run typecheck

      - name: Run mobile Jest tests
        working-directory: apps/mobile
        run: npm test

      - name: Build ARM64 debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assemblePublicDebug --no-daemon

      - name: Verify debug APK architecture
        run: |
          APK_DIR=apps/mobile/android/app/build/outputs/apk/public/debug
          APK_FILES=("$APK_DIR"/*.apk)
          APK="${APK_FILES[0]}"
          if [[ ${#APK_FILES[@]} != 1 || "$APK" != */KShell-*-arm64-v8a-publicDebug.apk || ! -f "$APK" ]]; then
            echo "::error::Expected exactly one ARM64 debug APK"
            exit 1
          fi
          ABIS=$(unzip -Z1 "$APK" | awk -F/ '$1 == "lib" && $3 ~ /\.so$/ {print $2}' | sort -u)
          if [[ "$ABIS" != arm64-v8a ]]; then
            echo "::error::Unexpected APK architectures: $ABIS"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: kshell-arm64-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/public/debug/KShell-*-arm64-v8a-publicDebug.apk
          if-no-files-found: error
