name: android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 24 mirrors the dev environment; npm 12 (needed for
          # patchedDependencies) itself requires Node >= 22.
          node-version: 24

      # npm patchedDependencies (our gradle-plugin patch) needs npm >= 12;
      # Node 20 bundles npm 10 which silently ignores the patch config.
      - name: Upgrade npm
        run: npm install -g npm@12

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install dependencies (workspaces + npm patches)
        run: npm install

      - name: Verify gradle-plugin patch applied
        run: |
          if grep -q "foojay-resolver-convention" node_modules/@react-native/gradle-plugin/settings.gradle.kts; then
            echo "::error::npm patch did not apply — build would fail on Gradle 9"
            exit 1
          fi

      - name: Run core-shell tests
        run: npx vitest run

      - name: Decode release signing key
        env:
          ZS_KEYSTORE_BASE64: ${{ secrets.ZS_KEYSTORE_BASE64 }}
        run: printf '%s' "$ZS_KEYSTORE_BASE64" | base64 -d > "$HOME/zshell-release.keystore"

      - name: Build signed public ARM64 APK
        working-directory: apps/mobile/android
        env:
          ZS_KEYSTORE_PASSWORD: ${{ secrets.ZS_KEYSTORE_PASSWORD }}
          ZS_KEY_ALIAS: ${{ secrets.ZS_KEY_ALIAS }}
          ZS_KEY_PASSWORD: ${{ secrets.ZS_KEY_PASSWORD }}
        run: |
          ./gradlew assemblePublicRelease --no-daemon \
            -PZS_STORE_FILE="$HOME/zshell-release.keystore" \
            -PZS_STORE_PASSWORD="$ZS_KEYSTORE_PASSWORD" \
            -PZS_KEY_ALIAS="$ZS_KEY_ALIAS" \
            -PZS_KEY_PASSWORD="$ZS_KEY_PASSWORD"

      - name: Verify APK architecture and release signature
        run: |
          APK_DIR=apps/mobile/android/app/build/outputs/apk/public/release
          APK_FILES=("$APK_DIR"/*.apk)
          APK="${APK_FILES[0]}"
          if [[ ${#APK_FILES[@]} != 1 || "$APK" != */KShell-*-arm64-v8a-publicRelease.apk || ! -f "$APK" ]]; then
            echo "::error::Expected exactly one public ARM64 APK"
            exit 1
          fi
          ABIS=$(unzip -Z1 "$APK" | awk -F/ '$1 == "lib" && $3 ~ /\.so$/ {print $2}' | sort -u)
          if [[ "$ABIS" != arm64-v8a ]]; then
            echo "::error::Unexpected APK architectures: $ABIS"
            exit 1
          fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          CERTS=$("$APKSIGNER" verify --print-certs "$APK")
          if ! grep -Fqx 'Signer #1 certificate SHA-256 digest: 4afedb378988506dac7fd47ab5829257174c9e54fb2d6e377c64c9823fd26b5d' <<< "$CERTS"; then
            echo "::error::APK is not signed with the KShell release key"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kshell-public-arm64-apk
          path: apps/mobile/android/app/build/outputs/apk/public/release/KShell-*-arm64-v8a-publicRelease.apk
          if-no-files-found: error
